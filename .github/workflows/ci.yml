name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        env:
          NEXT_PUBLIC_WP_GRAPHQL_ENDPOINT: https://wp.papelitobrasil.com.br/graphql
          NEXT_PUBLIC_WP_REST_BASE: https://wp.papelitobrasil.com.br/wp-json
          NEXTAUTH_SECRET: ci-build-secret-only
          NEXTAUTH_URL: http://localhost:3000
          USE_MOCK_DATA: "true"
        run: npm run build
